<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echo · 记忆树</title>
  <style>
    :root{--ink:#eaf4f6;--muted:#a8b8bc;--bg:#08121a;--panel:#10212c;--root:#d27b61;--traffic:#42a899;--memory:#6c9fd0;--accent:#e8a98a;font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}button,select{font:inherit}
    .top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#071017;border-bottom:1px solid #223641;position:relative;z-index:5}.brand{font:500 22px Georgia,serif}.top a{color:var(--muted);font-size:13px;text-decoration:none}
    .map{position:absolute;inset:54px 0 0;overflow:hidden}.map svg{width:100%;height:100%;display:block;background:#0c1b25;touch-action:none}
    .grid{stroke:#29424d;stroke-width:1;opacity:.48}.edge{fill:none;stroke:#718c95;stroke-width:2;opacity:.9;transition:stroke .3s,stroke-width .3s,opacity .3s}.edge.leaf{stroke:#5d968e}.edge.is-path{stroke:var(--accent);stroke-width:5;opacity:1;filter:drop-shadow(0 0 5px rgba(232,169,138,.45))}
    .node{cursor:pointer;outline:0;opacity:0;animation:grow .6s cubic-bezier(.2,.8,.2,1) forwards}.node circle{stroke:#071017;stroke-width:4;transition:stroke .25s,stroke-width .25s,filter .25s}.node.root circle{fill:var(--root);animation:breathe 3.4s ease-in-out infinite}.node.traffic circle{fill:var(--traffic)}.node.memory circle{fill:var(--memory)}.node.path circle,.node:focus circle{stroke:var(--accent);stroke-width:6;filter:drop-shadow(0 0 8px rgba(232,169,138,.5))}.label{fill:var(--ink);font-size:14px;pointer-events:none}
    .island{position:absolute;top:18px;right:18px;width:min(380px,calc(100vw - 36px));max-height:calc(100vh - 90px);overflow:auto;background:rgba(13,29,39,.96);border:1px solid #38505a;border-radius:12px;padding:14px;backdrop-filter:blur(8px);transition:transform .35s,opacity .35s}.island.closed{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}.island-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.island h1{font-size:17px;margin:0}.island p{color:var(--muted);font-size:13px;line-height:1.45;margin:8px 0 0}.close,.open{border:1px solid #48616b;background:#17313d;color:var(--ink);border-radius:6px;padding:7px 10px;cursor:pointer}.toolbar{display:grid;gap:9px;margin-top:14px}.toolbar label{color:var(--muted);font-size:12px}.toolbar select{width:100%;margin-top:5px;padding:8px;border-radius:6px;border:1px solid #48616b;background:#122833;color:var(--ink)}.action{border:0;background:#2d766d;color:white;border-radius:6px;padding:9px 12px;cursor:pointer}.status{color:var(--muted);font-size:12px;margin:10px 0 0}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0;color:var(--muted);font-size:12px}.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--traffic)}.legend .root:before{background:var(--root)}.legend .memory:before{background:var(--memory)}.detail{border-top:1px solid #29424d;margin-top:13px;padding-top:12px}.detail h2{font-size:15px;margin:0 0 8px}.row{display:grid;grid-template-columns:76px 1fr;gap:8px;border-bottom:1px solid #243a44;padding:8px 0}.row dt{color:var(--muted);font-size:12px}.row dd{margin:0;font-size:13px;line-height:1.4}.mobile-open{display:none;position:absolute;right:14px;bottom:14px;z-index:4}
    @keyframes grow{from{opacity:0;transform:scale(.6) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes breathe{0%,100%{filter:drop-shadow(0 0 0 rgba(210,123,97,0))}50%{filter:drop-shadow(0 0 18px rgba(210,123,97,.65))}}
    @media(max-width:640px){.top{height:48px;padding:0 20px}.map{inset:48px 0 0}.island{top:auto;right:0;bottom:0;width:100%;max-height:64vh;border-radius:14px 14px 0 0;transform:translateY(0);padding:20px;transition:transform .35s}.island.closed{transform:translateY(calc(100% - 54px));opacity:1;pointer-events:auto}.island.closed .toolbar,.island.closed .legend,.island.closed .detail{display:none}.mobile-open{display:block}.label{font-size:15px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.node{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="top"><span class="brand">Echo</span><a href="./index.html">返回面板</a></header>
  <main class="map" id="map"><div class="island" id="island"><div class="island-head"><div><h1>记忆树</h1><p>从中心记忆向外展开两层关系。</p></div><button class="close" id="close" type="button">收起</button></div><div class="toolbar"><label>中心记忆<select id="seed" aria-label="选择中心记忆"></select></label><button class="action" id="refresh" type="button">重新读取</button><button class="open" id="toggle" type="button">收起工具</button></div><div class="legend"><span class="root">中心记忆</span><span>交通节点</span><span class="memory">关联记忆</span></div><p class="status" id="status">正在读取只读图谱…</p><div class="detail" id="detail"><h2>节点详情</h2><p>选择节点查看摘要、连接原因和证据状态。</p></div></div><button class="open mobile-open" id="mobileOpen" type="button">工具</button></main>
  <script>
    (()=>{const api="/api/echo/consolidation-graph",fixture=location.search.includes("fixture=1"),$=id=>document.getElementById(id),map=$("map"),island=$("island"),seed=$("seed"),status=$("status"),detail=$("detail");let data=null,rootId="",selected=null,expanded=new Set;
      const synthetic={schema:"echo-consolidation-graph/v1",readOnly:true,summarySource:"fixture_by_id",summaryMissing:false,summaryMissingCount:0,nodes:[{id:"memory:m1",type:"memory",label:"整理项目图谱",summary:"整理项目图谱",degree:1},{id:"traffic:project",type:"traffic",label:"Project",degree:2},{id:"traffic:research",type:"traffic",label:"Research",degree:1},{id:"memory:m2",type:"memory",label:"研究材料已归档",summary:"研究材料已归档",degree:1}],edges:[{id:"memory-link:l1",source:"memory:m1",target:"traffic:project",kind:"memory-link",relation:"连接",evidenceStatus:"verified"},{id:"traffic-link:t1",source:"traffic:project",target:"traffic:research",kind:"traffic-link",relation:"related",evidenceStatus:"verified"},{id:"memory-link:l2",source:"memory:m2",target:"traffic:project",kind:"memory-link",relation:"连接",evidenceStatus:"verified"}]};
      const svg=(tag,a={})=>{const n=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);return n};
      function empty(text){map.querySelector("svg")?.remove();status.textContent=text}
      async function load(url=api+"?kind=all&depth=2&limit=240"){status.textContent="读取只读图谱…";try{data=fixture?synthetic:await fetch(url,{method:"GET",credentials:"omit"}).then(r=>{if(!r.ok)throw Error("read");return r.json()});const ms=data.nodes.filter(n=>n.type==="memory");seed.replaceChildren(...ms.map(n=>{const o=document.createElement("option");o.value=n.id;o.textContent=n.label;return o}));rootId=ms.some(n=>n.id===rootId)?rootId:ms[0]?.id||"";seed.value=rootId;status.textContent=data.summaryMissing?"已读取；部分摘要缺失":"已读取只读图谱";render()}catch{status.textContent="只读图谱暂时不可用";empty("未能读取图谱")}}
      function render(){const ns=new Map(data.nodes.map(n=>[n.id,n])),root=ns.get(rootId);if(!root)return;const edges=data.edges||[],traffic=edges.filter(e=>e.kind==="memory-link"&&(e.source===root.id||e.target===root.id)).map(e=>ns.get(e.source===root.id?e.target:e.source)).filter(Boolean),W=map.clientWidth||1000,H=map.clientHeight||700,svgRoot=svg("svg",{viewBox:`0 0 ${Math.max(W,900)} ${Math.max(H,600)}`,role:"img","aria-label":"独立记忆树"});for(let x=0;x<Math.max(W,900);x+=80)svgRoot.append(svg("path",{d:`M${x},0V${Math.max(H,600)}`,class:"grid"}));for(let y=0;y<Math.max(H,600);y+=80)svgRoot.append(svg("path",{d:`M0,${y}H${Math.max(W,900)}`,class:"grid"}));const links=svg("g"),nodes=svg("g"),points=new Map,rootPoint={x:W<600?W/2:Math.max(450,W/2),y:Math.max(130,H*.22)};points.set(root.id,rootPoint);draw(root,rootPoint,"root");
        traffic.forEach((t,i)=>{const p={x:W<600?W/2:220+i*(Math.max(560,W-440)/Math.max(1,traffic.length-1)),y:Math.max(300,H*.5)};points.set(t.id,p);edge(root,t,p,"");draw(t,p,"traffic");if(expanded.has(t.id)){const leaves=edges.filter(e=>e.kind==="memory-link"&&(e.source===t.id||e.target===t.id)).map(e=>ns.get(e.source===t.id?e.target:e.source)).filter(n=>n?.type==="memory"&&n.id!==root.id);leaves.forEach((leaf,j)=>{const q={x:p.x+(j-(leaves.length-1)/2)*140,y:Math.min(H-100,Math.max(500,H*.78))};points.set(leaf.id,q);edge(t,leaf,q,"leaf");draw(leaf,q,"memory")})}});
        map.querySelector("svg")?.remove();map.prepend(svgRoot);function draw(n,p,role){const g=svg("g",{class:`node ${role} ${selected?.id===n.id?"is-path":""}`,tabindex:"0",role:"button","aria-label":n.label});g.append(svg("circle",{cx:p.x,cy:p.y,r:role==="root"?28:role==="traffic"?18:14}));const t=svg("text",{x:p.x+34,y:p.y+5,class:"label"});t.textContent=n.label;g.append(t);g.addEventListener("click",()=>{selected=n;if(role==="traffic"){expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id)}render();details(n)});nodes.append(g)}function edge(a,b,p,extra){const q=points.get(a.id),path=svg("path",{d:`M${q.x},${q.y+24} C${q.x},${(q.y+p.y)/2} ${p.x},${(q.y+p.y)/2} ${p.x},${p.y-18}`,class:`edge ${extra} ${selected&&(selected.id===a.id||selected.id===b.id)?"is-path":""}`});links.append(path)}svgRoot.append(links,nodes);details(selected||root)}
      function details(n){const es=data.edges.filter(e=>e.source===n.id||e.target===n.id);detail.replaceChildren();const h=document.createElement("h2");h.textContent=n.type==="memory"?"中心记忆":"交通节点";detail.append(h,...[["名称",n.label],["摘要",n.summary||"未记录"],["连接原因",es.map(e=>e.relation).join("、")||"未记录"],["证据状态",es.some(e=>e.evidenceStatus==="verified")?"可核验":"未记录可验证回执"]].map(([k,v])=>{const d=document.createElement("dl");d.className="row";const a=document.createElement("dt");a.textContent=k;const b=document.createElement("dd");b.textContent=v;d.append(a,b);return d}))}
      $("refresh").onclick=()=>load();$("seed").onchange=()=>{rootId=seed.value;expanded.clear();load(api+"?kind=all&depth=2&node="+encodeURIComponent(rootId)+"&limit=240")};$("toggle").onclick=()=>island.classList.toggle("closed");$("close").onclick=()=>island.classList.add("closed");$("mobileOpen").onclick=()=>island.classList.remove("closed");load();
    })();
  </script>
</body>
</html>
