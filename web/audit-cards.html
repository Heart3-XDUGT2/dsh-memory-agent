<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo 审计面板</title>
<style>
:root{--bg:#0a1120;--nav:#0d1526;--p1:#121c30;--p2:#16213a;--p3:#1c2842;--ln:#26334a;--ln2:#35486a;--tx:#e8eef8;--mut:#93a4bd;--amb:#4cc2f5;--tea:#34d399;--ros:#f87171;--sky:#7dd3fc;--vio:#a78bfa;--say-fg:#dbeafe;--note-bg:#0f1c2e;--note-fg:#cfe3f5;--note-line:#2b4463;--accent-ghost:rgba(76,194,245,.05);--ease:cubic-bezier(.2,.7,.2,1);--t:.18s}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.55 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:left}
button:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12px}
header{padding:10px 18px;border-bottom:1px solid var(--ln);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;background:var(--nav)}
header h1{font-size:15px;margin:0;font-weight:600}header span{color:var(--mut);font-size:12px}
.app{flex:1;display:grid;grid-template-columns:250px 1fr;min-height:0}
nav{border-right:1px solid var(--ln);overflow:auto;padding:8px;background:var(--nav)}
nav h2{font-size:12px;color:var(--mut);font-weight:500;margin:12px 8px 4px}
.tn{display:block;width:100%;padding:8px 10px;border-radius:7px;border:1px solid transparent;transition:background var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.tn:hover{background:var(--p1)}.tn.on{background:var(--p2);border-color:var(--amb)}
.tn b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn small{color:var(--mut);display:flex;justify-content:space-between;margin-top:2px}

.hist{border:0;width:100%;display:flex;justify-content:space-between;color:var(--mut);font-size:12px;padding:12px 8px 4px}
.hist i{font-style:normal;display:inline-block;transition:transform .22s var(--ease)}.o>.hist i{transform:rotate(90deg)}
main{overflow:auto;padding:16px 20px;min-width:0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bub,.det,.par{background:var(--p1);border:1px solid var(--ln);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.bub{padding:10px 12px;min-height:64px;max-height:130px;overflow:auto;white-space:pre-wrap;word-break:break-word}
h3{margin:0 0 4px;font-size:12px;color:var(--mut);font-weight:500}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;color:var(--mut);font-size:12px}.meta b{color:var(--tx);font-weight:500}
.note{background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-fg);border-radius:7px;padding:6px 10px;font-size:12px;margin:8px 0}
.flow{display:flex;gap:5px;align-items:stretch;margin:14px 0 10px;overflow-x:auto;padding:4px 2px 8px}
.arr{color:var(--ln2);flex:none;align-self:center}
.nd{flex:1 0 104px;min-height:84px;border-radius:9px;padding:8px 9px;background:var(--p1);border:1px solid var(--ln);transition:transform var(--t) var(--ease),background var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease),color var(--t)}
.nd b{display:flex;justify-content:space-between;font-weight:600}.nd b em{font-style:normal;color:var(--tea);font-weight:500}
.nd p{margin:4px 0 0;font-size:11.5px;color:var(--mut);word-break:break-word}
.nd.has{background:color-mix(in srgb,var(--tea) 9%,var(--p1));border-color:color-mix(in srgb,var(--tea) 42%,var(--ln))}.nd.has p{color:color-mix(in srgb,var(--tea) 55%,var(--tx))}
.nd.no{border-style:dashed;background:transparent;color:var(--mut)}.nd.unl{border:1px dotted var(--ln2);background:transparent;color:var(--mut)}
.nd:hover{transform:translateY(-1px);border-color:var(--ln2)}.nd.has:hover{border-color:var(--tea)}
.nd.sel{box-shadow:0 0 0 1.5px var(--amb),0 8px 20px -10px rgba(76,194,245,.40)}
.nd2{flex:2 0 190px}.ser{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}.ser i{color:var(--tea);font-style:normal}
.pl{font-size:11px;border:1px dashed var(--ln2);border-radius:5px;padding:0 6px;color:var(--mut);transition:all var(--t)}.pl.k{border-style:solid;border-color:var(--tea);color:var(--tx);background:rgba(71,184,164,.12)}
.par{padding:10px 14px 8px;margin:6px 0 10px}.par .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}.par .h span{color:var(--mut);font-size:12px}
.tl{position:relative;height:118px;margin:4px 8px 0 92px}
.lb{position:absolute;left:-92px;width:84px;font-size:12px;color:var(--mut)}
.mt{position:absolute;left:0;right:0;top:12px;height:2px;border-radius:1px;background:var(--ln2)}
.ln{position:absolute;left:0;right:0;border-top:1px dashed var(--ln2);height:0}
.bar{position:absolute;height:12px;border-radius:6px;transform-origin:left;transition:filter var(--t),transform var(--t) var(--ease)}.bar:hover{filter:brightness(1.2)}
.bar.sel{outline:1.5px solid var(--amb);outline-offset:2px}
.stem{position:absolute;width:0;border-left:2px solid}.stem.d{border-left-style:dashed}
.bl{position:absolute;font-size:11.5px;white-space:nowrap;color:var(--tx)}.em{position:absolute;font-size:11.5px;color:var(--mut)}
.ax{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--ln);display:flex;justify-content:space-between;color:var(--mut);font-size:11px;padding-top:2px}
/* ★ 2026-10-18 P2：没发生的阶段收成一行灰字（不再占等宽方块） */
.skip-row{display:flex;gap:2px 8px;flex-wrap:wrap;align-items:baseline;margin:-2px 0 10px;font-size:11.5px;color:var(--mut)}
.skip-row>span{opacity:.7;margin-right:2px}
.skip{font-size:11.5px;color:var(--mut);border-radius:4px;padding:1px 5px;transition:color var(--t),background var(--t)}
.skip:hover{color:var(--tx);background:var(--p1)}
.skip:focus-visible{outline:2px solid var(--amb);outline-offset:1px}
/* 骨架屏：先用占位块说「在读」，别让人对着空白等 */
@keyframes sk{0%{opacity:.35}50%{opacity:.7}100%{opacity:.35}}
.sk{background:var(--p2);border-radius:6px;animation:sk 1.1s var(--ease) infinite}
.sk-nav{padding:8px}.sk-nav .sk{height:34px;margin-bottom:8px}
.sk-main{padding:16px 20px}.sk-main .sk{height:22px;margin-bottom:10px}
.sk-main .sk.tall{height:66px}
/* 错误态：说清怎么恢复，并给一个真的能点的重试 */
.err{padding:18px;max-width:520px}
.err h3{color:var(--ros);margin-bottom:8px}
.err p{color:var(--mut);font-size:12.5px;line-height:1.6;margin-bottom:12px;word-break:break-word}
.err .retry{border:1px solid var(--amb);color:var(--amb);border-radius:7px;padding:5px 14px;font-size:12.5px;transition:background var(--t)}
.err .retry:hover{background:rgba(76,194,245,.10)}
.err .retry:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.empty{padding:18px;max-width:520px;color:var(--mut);font-size:12.5px;line-height:1.6}
.un{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;color:var(--mut);font-size:12px}
.chip{border:1px solid var(--ln);border-radius:14px;padding:1px 10px;color:var(--mut);font-size:12px;transition:color var(--t),border-color var(--t),background var(--t)}.chip:hover{color:var(--tx);border-color:var(--ln2)}.chip.on{border-color:var(--amb);color:var(--amb);background:rgba(76,194,245,.10)}
.det{padding:12px 14px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin-bottom:10px;position:relative}
.tab{padding:5px 12px;color:var(--mut);transition:color var(--t)}.tab:hover{color:var(--tx)}.tab.on{color:var(--tx)}
.ind{position:absolute;left:0;bottom:-1px;height:2px;background:var(--amb);border-radius:1px;transition:transform .26s var(--ease),width .26s var(--ease)}
.pane.in{animation:fade .2s var(--ease)}
.seg{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:6px 0 10px;gap:1px}.seg i{display:block}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px;font-size:12px;color:var(--mut)}.leg u{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;text-decoration:none}
pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--ln);border-radius:7px;padding:8px 10px;max-height:300px;overflow:auto}
table{border-collapse:collapse;width:100%}td,th{padding:4px 8px;border-bottom:1px solid var(--ln);vertical-align:top;text-align:left}
th{color:var(--mut);font-weight:500;white-space:nowrap}td.k{color:var(--mut);white-space:nowrap;width:1%}
.x{color:var(--mut);transition:color var(--t)}.x:hover{color:var(--tx)}.x i{font-style:normal;display:inline-block;transition:transform .22s var(--ease)}.o>.x i{transform:rotate(90deg)}.o>.x .a1,.x .a2{display:none}.o>.x .a2{display:inline}
.cx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease)}.o>.cx{grid-template-rows:1fr}.cxi{overflow:hidden;min-height:0}.cxi>*{margin-top:6px}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:4px;padding:0 5px;color:var(--mut)}.tag.g{color:var(--amb);border-color:color-mix(in srgb,var(--amb) 40%,var(--ln))}.tag.p{color:var(--sky);border-color:color-mix(in srgb,var(--sky) 40%,var(--ln))}
.led{margin-top:16px}.led .sc{max-height:230px;overflow:auto;border:1px solid var(--ln);border-radius:9px}
.led tr{cursor:pointer}.led td{transition:background var(--t)}.led tr:hover td{background:var(--p1)}.led tr.on td{background:var(--p2)}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0);opacity:.2}to{transform:none;opacity:1}}
.sw>.sum,.sw>.det,.sw>.led{animation:fade .24s var(--ease) both}.sw .nd{animation:fade .3s var(--ease) both;animation-delay:calc(var(--i)*26ms)}.sw .bar{animation:grow .5s var(--ease) .15s both}.sw .stem{animation:fade .3s .3s both}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{max-height:170px;border-right:0;border-bottom:1px solid var(--ln)}.sum{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<header><h1>Echo 审计面板</h1><span id="hs"></span></header>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
// 本文件可独立打开(web/app.js 的导航以 target=_blank 指向它)。
// 数据来源:/api/echo/audit —— **异步 fetch**(同步 XHR 在部分浏览器/上下文会被拦,是"打开是空的"最常见原因)。
// 拿到后重建 D / items,再跑原有的 nav();open(0)。其余一行未动。
let D={meta:{totalRows:0,columns:[],generatedAt:new Date().toISOString()},new:[],hist:[],n:0};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=[0,'收到','检索','组装','工具','回复','送信','提取','补一句','她起头'],INSTR=[2,3,7,8];
// ★ 2026-10-19：记忆整固那两个 tool_call 原来**不在表里**。
//   `stepOf` 依次查 step → tool_call → stage → trace_id#，三处全是 0
//   ⇒ `gk` 返回 u ⇒ 整固行掉进「未标注」，阶段流里根本没有它的位置。
//   归 7（提取）与 extract / reflect 同档 —— BUCKETS.reflect 的定义本来就写着
//   「把这一轮收成记忆(提取器旁白 / 记忆整固)」。
const N2S={relay_in:1,retrieve:2,graph_query:2,assemble:3,structured_output:5,echo_qq_say:6,relay_out:6,extract:7,reflect:7,reflection:7,reflection_failed:7,longing_steer:8,care:9,remind:9,wake:9,same_turn_emotion:21,query_expand:22};
const COL=['var(--amb)','var(--tea)','var(--vio)','var(--ros)','var(--sky)','color-mix(in srgb,var(--tea) 55%,var(--sky))'];
const jp=s=>{try{return JSON.parse(s)}catch(e){return null}},trunc=s=>{const m=/\[截断,原长 (\d+)\]/.exec(s||'');return m?+m[1]:0},len=s=>trunc(s)||(s||'').length;
const hms=t=>new Date(t*1000).toLocaleTimeString('zh-CN',{hour12:false});
const mood=r=>{const m=/"moodIntensity":(\d+),"prevMoodIntensity":(\d+)/.exec(r.agent_state||'');return m?[+m[2],+m[1]]:null};
/* 归位顺序:**step → tool_call → stage → trace_id#**。
 * 2026-10-10:原来缺 tool_call 这一环,而 `relay_in` / `relay_out` / `echo_qq_say`
 * 这三种行**只写 tool_call、不写 stage**(见活库:各 36/42/47 行,stage 全空)
 * ⇒ 永远归不到位 ⇒「1 收到 / 6 送信」两格恒空,尽管数据在库里。N2S 里本来就有
 * `relay_in:1` / `relay_out:6` / `echo_qq_say:6`,白写了。
 * 放在 stage **之前**是因为 tool_call 更具体,且顺带修掉第二个缺陷:
 * `structured_output` 行的 stage 是 `tool:structured_output`,被 `/^tool:/`
 * 抢先判成 step=4(工具),而它其实是「5 回复」。 */
const stepOf=r=>{let s=+r.step||0;
 if(!s&&r.tool_call)s=N2S[r.tool_call]||0;
 if(!s&&r.stage)s=/^tool:/.test(r.stage)?(/^tool:structured_output$/.test(r.stage)?5:4):(N2S[r.stage]||0);
 if(!s&&(r.trace_id||'').includes('#'))s=N2S[r.trace_id.split('#')[1]]||0;
 return s};
const gk=r=>{const s=stepOf(r);return s===21||s===22?'a'+s:(s>=1&&s<=9)||s===90?'s'+s:'u'};
const gname=g=>g==='u'?'未标注':g==='a21'?'情绪打分（并行）':g==='a22'?'查询扩展（侧路）':g==='s90'?'轮外':ST[+g.slice(1)];
let cur=0,selG='u',selR=0,tab=0,T,by={},rows=[];
let items=[]; // D 到位后再填(见文件末尾的 load())
function nav(){let h='<h2>分轮 · 有阶段标注</h2>';
 D.new.forEach((t,i)=>{const have=new Set(t.rows.map(gk));const nSt=ST.slice(1).filter((_,j)=>have.has('s'+(j+1))).length;h+=`<button class="tn" data-i="${i}" title="${esc(t.raw)}"><b>${esc(t.title)}</b><small><span>${hms(t.rows[0].timestamp)}</span><span>${t.rows.length} 条</span></small><span title="这一轮走到了哪几个阶段">${nSt}/9 阶段</span></button>`});
 h+=`<div class="cxw" id="hw"><button class="hist x" data-x>历史（未分轮）· ${D.hist.length} 组<i>›</i></button><div class="cx"><div class="cxi">${D.hist.map((t,i)=>`<button class="tn" data-i="${D.new.length+i}"><b>${esc(t.title)}</b><small><span>${hms(t.rows[0].timestamp)}</span><span>${t.rows.length} 条</span></small></button>`).join('')}</div></div></div>`;
 $('#nav').innerHTML=h}
function open(i){cur=i;T=items[i];rows=T.rows.slice().sort((a,b)=>a.timestamp-b.timestamp);by={};rows.forEach(r=>(by[gk(r)]=by[gk(r)]||[]).push(r));
 selG=['s1','s2','s3','s4','s5','s6','s7','s8','s9','s90','a21','a22','u'].find(k=>by[k])||'u';selR=0;tab=0;
 document.querySelectorAll('.tn').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));$('#hw').classList.toggle('o',i>=D.new.length||$('#hw').classList.contains('o'));build()}
const isNew=()=>cur<D.new.length;
function sum(k){const rs=by['s'+k],ms=rs.reduce((a,r)=>a+(r.latency||0),0),sd=jp(rs[0].stage_detail),c=len(rs[0].llm_reply);
 return [k===3&&sd&&sd.total?`注入 ${sd.total} 字`:'',c?c+' 字':'',ms?(ms>600000?'时长可疑('+Math.round(ms/60000)+' 分,疑似脏值)':ms+'ms'):'',rs.length>1?'':''].filter(Boolean).join(' · ')||`${rs.length} 条记录`}
function par(){const a=[by.a21,by.a22].map(x=>x&&x[0]),sd=a.map(r=>r&&jp(r.stage_detail));
 const ps=sd.filter(x=>x&&x.beginAt);let lo=0,hi=1;
 if(ps.length){const b=Math.min(...ps.map(x=>x.beginAt)),e=Math.max(...ps.map(x=>x.settleAt||x.beginAt+x.ms)),p=Math.max((e-b)*.3,120);lo=b-p;hi=e+p}
 const X=v=>((v-lo)/(hi-lo)*100).toFixed(2)+'%',Y=[56,94],C=['var(--sky)','var(--vio)'];
 const mt=(rows.filter(r=>by.u&&by.u.includes(r)||1)[0],'');
 let h=`<div class="par"><div class="h"><b>并行支</b><span>两处真并发，都从用户开口那一刻并起；检索本身是串行两跳</span></div><div class="tl"><span class="lb" style="top:4px">主流程</span><div class="mt"></div><span class="lb" style="top:${Y[0]-9}px">情绪打分<br><small>并行 · 汇合</small></span><span class="lb" style="top:${Y[1]-9}px">查询扩展<br><small>侧路 · 可缺席</small></span>`;
 [0,1].forEach(i=>{const r=a[i],s=sd[i],d=i?' d':'',y=Y[i];
  if(!(r&&s&&s.beginAt)){h+=`<div class="ln" style="top:${y}px"></div><span class="em" style="left:10px;top:${y-24}px;background:var(--p1);padding:0 6px">${r?'有记录但没有时间字段':i?'没有记录 · 早退路径（未接 run / 空查询 / 缓存命中）不写审计，不等于没跑':'这轮没发生'}</span>`;return}
  const b=s.beginAt,e=s.settleAt||b+s.ms,bad=s.timedOut||s.ok===false,col=bad?'var(--ros)':C[i],idx=rows.indexOf(r);
  h+=`<div class="stem${d}" style="left:${X(b)};top:14px;height:${y-14}px;border-color:${col}"></div><div class="stem${d}" style="left:${X(e)};top:14px;height:${y-14}px;border-color:${col}"></div><button class="bar${selG==='a'+(21+i)?' sel':''}" data-row="${idx}" style="left:${X(b)};width:calc(${X(e)} - ${X(b)});min-width:6px;top:${y-6}px;background:${col}${i?';opacity:.8':''}" title="${s.ms}ms"></button><span class="bl" style="left:${X(b)};top:${y-28}px">${s.ms} ms · ${s.timedOut?'超时（timedOut）':s.ok===false?'失败':'完成'}${s.ok===false?'，ok=false':''}</span>`});
 const n=ps.length?5:0;h+=`<div class="ax">${ps.length?[...Array(n)].map((_,j)=>`<span>+${Math.round((hi-lo)*j/(n-1))}ms</span>`).join(''):'<span>没有并行支的时间数据</span>'}</div></div>`;
 const tt=ps[0]&&ps[0].turnTrace;if(tt)h+=`<div class="un" style="margin:8px 0 0">归属主轮 <span class="mono">${esc(tt.slice(0,8))}…</span>${rows.some(r=>r.trace_id===tt)?'':' · 该 trace 在本窗口没有对应行（这轮的主线行用另一个 trace_id 写入）'}</div>`;
 return h+'</div>'}
function build(){const t=T,m=rows.map(mood).filter(Boolean),rin=rows.find(r=>r.tool_call==='relay_in')||rows.find(r=>r.user_input)||rows[0],
 rep=[...rows].reverse().find(r=>r.llm_reply&&['relay_out','echo_qq_say','structured_output','extract','reflection'].includes(r.tool_call));

          if(nv)nv.innerHTML='';

            +'/api/echo/audit 返回了 0 条 —— 说明最近这批里没有带 stage / step 的记录。'
            +'<br>跑一轮对话（或在 QQ 里跟她说句话）再刷新就有了。</div>';
          return}
    nav();open(0);
  }).catch(e=>{
    // ★ 2026-10-18 P2：错误态要说清**怎么恢复**，并给一个**真能点**的重试
    //   （craft-floor：错误的文案要命名问题和恢复办法；operate.md：七态不许只做一半）。
    const why=String((e&&e.message)||e||'未知错误').replace(/[<>&]/g,'');
    const nav=document.querySelector('#nav'),mn=document.querySelector('#main');
    if(nav)nav.innerHTML='';
    if(mn)mn.innerHTML='<div class="err"><h3>没能取到审计数据</h3>'
      +'<p>'+why+'</p>'
      +'<p>先确认 <b>dsh web</b> 还在跑，再确认 <code>/api/echo/audit</code> 打得开。'
      +'数据一直在库里，刷新不会丢东西。</p>'
      +'<button class="retry" id="retry">重新读一次</button></div>';
    const btn=document.querySelector('#retry');
    if(btn)btn.addEventListener('click',()=>location.reload());
    console.error('审计面板：'+why);
  });
}
load();
</script></body></html>
