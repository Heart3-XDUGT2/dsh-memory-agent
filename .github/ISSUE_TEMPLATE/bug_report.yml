name: Bug report
description: 使用合成数据报告可复现问题
body:
  - type: markdown
    attributes:
      value: "安全问题按SECURITY.md私密报告。不要上传聊天、数据库、配置、账号、token或私图。"
  - type: textarea
    id: versions
    attributes:
      label: 环境版本
      description: 插件、DSH、Node、Python、系统；删除个人路径。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小合成复现、预期与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 内容确认
      options:
        - label: 已确认不含真实聊天、数据库、凭据、账号或个人信息。
          required: true
